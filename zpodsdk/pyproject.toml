[project]
name = "zpodsdk"
version = "0.8.0"
description = "A client library for accessing zPod API"
authors = []
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "attrs==26.1.0",
    "python-dateutil==2.9.0.post0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.uv]
# Supply-chain mitigation: ignore packages published in the last 30 days.
exclude-newer = "30 days"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/zpodsdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/zpodsdk",
    "README.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
