[project]
name = "zpodcli"
version = "0.7.2"
description = ""
authors = [{ name = "Timo Sugliani", email = "timo.sugliani@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4",
    "typer==0.27.1",
    "pyyaml==6.0.3",
    # Compatible release: this version or a later patch of it, never the next minor. Moved by
    # tools/release.py at every stack cut; left alone by a zpodcli-only patch release.
    "zpodsdk~=0.7.2",
]

[project.scripts]
zcli = "zpodcli.main_cli:launch"

[dependency-groups]
dev = [
    "ipython==9.16.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.uv]
# Supply-chain mitigation: ignore packages published in the last 30 days.
exclude-newer = "30 days"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Dev-only path override. Released wheels still require zpodsdk~=<version> from
# PyPI because `uv build` ignores [tool.uv.sources].
[tool.uv.sources]
zpodsdk = { path = "../zpodsdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zpodcli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
