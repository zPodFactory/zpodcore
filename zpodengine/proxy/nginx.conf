# Public front of the Prefect server: reads and cancelling runs pass, anything else gets a 403.
# zpodapi and the worker talk to zpodengineserver:4200 directly; host tooling uses
# ZPODENGINE_ADMIN_HOSTPORT.
load_module modules/ngx_http_js_module.so;

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log off;
    error_log /dev/stderr warn;

    js_import prefect_ro from /etc/nginx/prefect_ro.js;

    # Prefect's queries are POSTs: allow those that only read. get_runs and
    # get_scheduled_flow_runs stay out: they mark queues as polled, like a live worker.
    map "$request_method:$uri" $prefect_ro_allowed {
        default 0;
        "~^(GET|HEAD|OPTIONS):"                                                         1;
        "~^POST:/api/(.+/)?(filter|count|history|paginate|lateness|concurrency_status)$" 1;
        "~^POST:/api/events/count-by/"                                                  1;
        "~^POST:/api/ui/"                                                               1;
        "~^POST:/api/((ui/schemas|templates|automations/templates)/validate)$"          1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;

    server {
        listen 4200;
        client_max_body_size 1m;
        # The cancel check reads the body, which must stay in memory.
        client_body_buffer_size 1m;

        # Websockets that write: clients emitting events, task workers taking runs.
        location ~ ^/api/(events/in|task_runs/subscriptions/) {
            return 403;
        }

        location ~ ^/api/flow_runs/[0-9a-f-]+/set_state$ {
            limit_except POST { deny all; }
            js_content prefect_ro.cancelOnly;
        }

        location / {
            if ($prefect_ro_allowed = 0) {
                return 403 '{"detail":"Prefect is read-only here, except for cancelling runs"}';
            }
            proxy_pass http://zpodengineserver:4200;
        }

        location @prefect {
            proxy_pass http://zpodengineserver:4200;
        }
    }
}
