[project]
name = "zpodengine"
version = "0.8.0"
description = ""
authors = [
    { name = "Kelby Valenti", email = "kelby.valenti@gmail.com" },
    { name = "Timo Sugliani", email = "timo.sugliani@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "email-validator==2.3.0",
    "jinja2==3.1.6",
    "prefect==3.8.8",
    "prefect-docker==0.7.3",
    "psycopg2==2.9.12",
    "pydantic-settings==2.15.0",
    "pyopenssl==26.4.0",
    "python-dotenv==1.2.3",
    "pyvmomi==9.1.0.0",
    "sqlmodel==0.0.39",
]

[dependency-groups]
dev = [
    # Interactive convenience only; never imported by the code.
    "ipython==9.16.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.4",
]

[tool.uv]
package = false
# Supply-chain mitigation: ignore packages published in the last 30 days.
exclude-newer = "30 days"
# Prefect 3.8.8 (uploaded 2026-10-06) is needed now; this waives the 30-day quarantine for
# prefect, and for python-slugify 9.0.0 (2026-09-08) which 3.8.8 requires. Remove both once
# they are older than 30 days (after 2026-11-05).
exclude-newer-package = { prefect = "2026-10-07T00:00:00Z", python-slugify = "2026-09-09T00:00:00Z" }

# Allow pytest to find zpodengine + zpodcommon, and pick up zpodcommon's own
# tests/ since zpodcommon has no venv of its own.
[tool.pytest.ini_options]
pythonpath = ["src", "../zpodcommon/src"]
testpaths = ["tests", "../zpodcommon/tests"]
