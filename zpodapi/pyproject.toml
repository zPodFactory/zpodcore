[project]
name = "zpodapi"
version = "0.7.2"
description = ""
authors = [
    { name = "Kelby Valenti", email = "kelby.valenti@gmail.com" },
    { name = "Timo Sugliani", email = "timo.sugliani@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.1",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "gitpython==3.1.59",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "psycopg2==2.9.12",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pyvmomi==9.1.0.0",
    "rich==15.0.0",
    "sqlmodel==0.0.39",
    "tenacity==9.1.4",
    "uvicorn==0.52.4",
    "uvicorn-worker==0.4.0",
]

[dependency-groups]
dev = [
    # Interactive convenience only; never imported by the code.
    "ipython==9.16.1",
    "coverage==7.15.4",
    "debugpy==1.8.21",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.4",
]

[tool.uv]
package = false
# Supply-chain mitigation: ignore packages published in the last 30 days.
exclude-newer = "30 days"

# Allow pytest to find zpodapi + zpodcommon without an editable install or docker.
[tool.pytest.ini_options]
pythonpath = ["src", "../zpodcommon/src"]
testpaths = ["tests"]
