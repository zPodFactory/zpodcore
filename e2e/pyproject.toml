[project]
name = "e2e"
version = "0.0.0"
description = "Live end-to-end test suite for zpodcore. Exercises zcli/zpodsdk (PyPI, on the server's minor version) against a real, already-running zPodFactory server. Not part of the zpodcore unit tests and does not depend on a local path into this repo - it is designed to be copied into its own standalone repository."
authors = [{ name = "Timo Sugliani", email = "timo.sugliani@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # zcli X.Y.* only talks to an API X.Y.*: keep these on the server's minor.
    "zpodsdk~=0.9.2",
    "zpodcli~=0.9.2",
    "pydantic-settings>=2.6",
    "dnspython>=2.6",
    "httpx>=0.27",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-timeout>=2.3",
    "ruff==0.15.9",
]


[tool.uv]
# Supply-chain mitigation: ignore packages published in the last 30 days -
# except our own zpodsdk/zpodcli, which must match the server under test the
# day it is released.
exclude-newer = "30 days"
exclude-newer-package = { zpodsdk = false, zpodcli = false }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: fast single minimal-zpod sanity pass",
    "full: full profile/component matrix",
    "concurrency: concurrent multi-zpod batch tests",
    "destructive: mutates shared/global state (settings, users) - restored afterward but riskier to interleave",
    "slow: long-running (deploy/download) - excluded from quick loops",
]
timeout = 14400

# Self-contained lint config (not inherited from the parent repo's root
# pyproject.toml) - keeps e2e/ lintable/runnable standalone if extracted.
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["e2e"]

[tool.hatch.build.targets.wheel]
packages = ["src/e2e"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
