[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",
    "E501",
    # ruff 0.16 folds mccabe (C90) into the "C" selector; six existing functions
    # exceed the default complexity of 10 and refactoring them is not lint work.
    "C901",
]

[tool.ruff.lint.isort]
known-first-party = [
    "zpodapi",
    "zpodcli",
    "zpodcommon",
    "zpodengine",
    "zpodsdk",
]

# The root carries no package, only this ruff configuration. The version lives in nine
# markers (four __init__.py, five pyproject.toml) that tools/release.py moves together at a
# cut and tools/version_markers.py --check keeps in agreement between releases.
